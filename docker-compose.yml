version: '3.8'

services:
  elite-hack-lab:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
    container_name: elite-hack-lab
    networks:
      - hacklab-net

networks:
  hacklab-net:
    driver: bridge
